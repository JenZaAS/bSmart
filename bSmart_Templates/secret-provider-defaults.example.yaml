# bSmart secret provider defaults example
# Copy to /workspace/bSmart/State/secret-provider-defaults.yaml and edit for one instance.
# Keep secret values out of this file.

secret_provider_defaults:
  mode: tailscale_aperture
  endpoint: tailnet-or-service-endpoint-without-embedded-credentials
  profile: example-agent-or-project-profile
  lookup_policy:
    request_by_logical_name: true
    never_print_values: true
    cache_to_disk: false
  required_secret_names:
    github_ssh_private_key:
      alias: git/ssh/private-key
    github_known_hosts:
      alias: git/ssh/known-hosts
    github_token:
      alias: github/api/token
      optional: true
