bswarm_run:
  goal: "<one-line goal>"
  scope: "<path/reference or none>"
  mode: unsupervised
  intent: review
  ab_testing: off
  bselective: all_off
  roles: [coder]
  statistics: on
  context_stats: on
  max_depth: 1
  max_total_child_agents: 3
  max_iterations: 5
  max_worker_attempts_per_supervisor: 5
  safety: read_only

  # Branch/stage shape for A/B/C runs. Remove branches not in scope.
  branches:
    ordinary:
      pattern: direct_worker
      context_mode: ordinary
      duplicate_file: "<run-folder>/ordinary/<target-copy>.m"
      stages:
        - coder
    bselective_architect_coder:
      pattern: architect_coder
      architect_context_mode: bselective
      coder_context_mode: plan_plus_targeted_ordinary
      duplicate_file: "<run-folder>/bselective-architect-coder/<target-copy>.m"
      artifacts:
        architect_plan: "<run-folder>/bselective-architect-coder/architect-plan.md"
      stages:
        - architect
        - coder
    ordinary_architect_coder:
      pattern: architect_coder
      architect_context_mode: ordinary
      coder_context_mode: plan_plus_targeted_ordinary
      duplicate_file: "<run-folder>/ordinary-architect-coder/<target-copy>.m"
      artifacts:
        architect_plan: "<run-folder>/ordinary-architect-coder/architect-plan.md"
      stages:
        - architect
        - coder

  contamination_rules:
    duplicate_source_before_edits: true
    original_source_read_only: true
    excluded_worker_paths:
      - "previous-generated-runs/"

  role_defaults:
    architect:
      # Default architect handoff budget: compact by default so coder receives a plan, not transcripts.
      handoff_kind: context-budget artifact
      target_words: 350-500
      hard_max_words: 700
      max_relevant_regions: 6
      max_must_implement_bullets: 6
      no_tool_transcripts: true
      no_long_source_quotes: true
      no_full_bselective_output: true
      required_sections:
        - target_file_path
        - relevant_regions
        - must_implement
        - defer
        - do_not_implement
        - risks
        - verification_checks
