bswarm_run:
  goal: "<one-line goal>"
  scope: "<path/reference or none>"
  # User-facing compact workflow keyword. Do not expose mixed stage combinations
  # unless this is a controlled experiment.
  workflow_keyword: cascade critic # explicit lighter modes remain available
  workflow: critcascade
  mode: unsupervised
  intent: review
  ab_testing: off
  bselective: all_on
  roles: [architect, architect_critic, worker, worker_critic]
  statistics: on
  context_stats: on
  max_depth: 3
  max_total_child_agents: 3
  max_iterations: 5 # General workflow iteration setting; critique_loop rounds are not capped by this value.
  critique_loop:
    target_score: 8
    stop_requires_no_critical_issues: true
    stop_requires_no_required_issues: true
    success_condition: "score >= 8 AND critical_issues == 0 AND required_changes == 0"
    initial_round_range: [1, 10]
    extension_block_size: 10
    no_hard_round_cap: true
    progress_events: [issue_closed_with_evidence, required_check_completed_with_evidence, same_rubric_score_increase_with_rationale]
    zero_progress_at_block_end: record_plateau_and_pause_ask
    safety_blocker: stop_immediately
    record: [block_range, progress_events, evidence, stop_reason]
  max_worker_attempts_per_supervisor: 5
  planned_timeout_seconds: 1200
  safety: read_only
  workflow_selection:
    critic_cascade_if:
      - multiple_or_dependent_tasks
      - unresolved_design_uncertainty
      - meaningful_risk
    smallest_mode_if: one_bounded_low_risk_deliverable
    ask_operator_if_unclear: true
  # Substantial-work default only; select lighter modes for bounded low-risk work.
  verification_policy:
    fields: [criterion_or_claim, evidence_or_check, expected_signal, actual_result, reference]
    require_each_criterion_or_claim: true
  testing_policy:
    selection: risk_based_and_requirement_linked
    small_component_default_scenarios: 10
    scenario_count_includes_parameterized_rows: true
    reported_issue_regressions: always_include
    include_if:
      - plausible_supported_behavior_with_meaningful_impact
      - remote_behavior_with_meaningful_or_high_harm
      - essential_acceptance_criterion_or_public_boundary
    exclude_if: implausible_and_harmless_unless_reported_or_contract_required
    small_component_above_default_requires_architect_rationale_and_critic_approval: true
    larger_scope_numeric_cap: none
    larger_scope_selection: risk_based_justified
  job:
    enabled: false
    package_root: "<project>/jobs"
    report: "<project>/jobs/<YYYY-MM-DD>-<slug>/report.md"
    plan: "<project>/jobs/<YYYY-MM-DD>-<slug>/plan.md"
  audit:
    enabled: false
    models_file: "./bSmart/State/bswarm-audit-models.yaml"
    model_list: []
    design: after_architect_plan
    code: after_task_list_empty
    audit_after_task: false
    auditor_continue_on: [automatic, decision]
    optional_only: stop
    external_model_required: true

  preflight_qc:
    adapter: hermes # hermes | opencode | codex | claude | unknown
    status: pending # pending | passed | blocked | downgraded
    required_for_nested_architect_dispatch:
      delegation.orchestrator_enabled:
        required: true
        observed: unknown
      delegation.max_spawn_depth:
        required: ">= 2"
        observed: unknown
      delegation.child_timeout_seconds:
        required: ">= planned_timeout_seconds"
        observed: unknown
    recommended_for_cascade:
      delegation.child_timeout_seconds: 1200
    adapter_note: "If not running under Hermes, verify adapter-specific nested workers or downgrade to supervisor_mediated_architect_handoff/supervisor_mediated_cascade."

  keyword_normalization:
    ordinary:
      context_mode: ordinary
      workflow: direct
    bSelective:
      context_mode: bselective
      workflow: direct
    architect:
      context_mode: ordinary
      workflow: architect_handoff
      worker_context_mode: ordinary
    bSelective architect:
      context_mode: bselective
      workflow: architect_handoff
      worker_context_mode: bselective
    cascade:
      context_mode: bselective
      workflow: architect_taskflow
      worker_context_mode: bselective
    bSelective cascade:
      context_mode: bselective
      workflow: architect_taskflow
      worker_context_mode: bselective
    cascade critic:
      context_mode: bselective
      workflow: critcascade
      worker_context_mode: bselective
    cascade critic audit:
      context_mode: bselective
      workflow: critcascade_audit
      worker_context_mode: bselective

  # Programming-only execution limits; omit for non-code workflows.
  cascade_defaults:
    max_tasks: 4
    max_coder_attempts_per_task: 1
    max_patch_calls_per_coder: 3
    stop_after_acceptance: true
    re_evaluate_after_each_task: true
    critic_model_policy: prefer_different_model
    same_model_fallback: record_reduced_independence
    architect_plan_checks:
      - reviewer_explain_back_without_architect_working_context
      - strict_ready_to_build_decision
      - compare_with_decisions_md_and_authoritative_decision_records
    architect_replan_after_each_task: true

  # Programming-specific A/B/C branch example; remove branches not in scope.
  branches:
    ordinary:
      pattern: direct_worker
      context_mode: ordinary
      duplicate_file: "<run-folder>/ordinary/<target-copy>.m"
      stages:
        - coder
    bselective:
      pattern: direct_worker
      context_mode: bselective
      duplicate_file: "<run-folder>/bselective/<target-copy>.m"
      stages:
        - coder
    architect:
      pattern: architect_coder
      architect_context_mode: ordinary
      coder_context_mode: ordinary
      duplicate_file: "<run-folder>/architect/<target-copy>.m"
      artifacts:
        architect_plan: "<run-folder>/architect/architect-plan.md"
      stages:
        - architect
        - coder
    bselective_architect:
      pattern: architect_coder
      architect_context_mode: bselective
      coder_context_mode: bselective
      duplicate_file: "<run-folder>/bselective-architect/<target-copy>.m"
      artifacts:
        architect_plan: "<run-folder>/bselective-architect/architect-plan.md"
      stages:
        - architect
        - coder
    cascade:
      pattern: architect_taskflow
      architect_context_mode: bselective
      coder_context_mode: bselective
      duplicate_file: "<run-folder>/cascade/<target-copy>.m"
      artifacts:
        architect_plan: "<run-folder>/cascade/architect-plan.md"
      stages:
        - architect
        - coder
        - architect_evaluation
    bselective_cascade:
      pattern: architect_taskflow
      architect_context_mode: bselective
      coder_context_mode: bselective
      duplicate_file: "<run-folder>/bselective-cascade/<target-copy>.m"
      artifacts:
        architect_plan: "<run-folder>/bselective-cascade/architect-plan.md"
      stages:
        - architect
        - coder
        - architect_evaluation
    critcascade:
      pattern: critcascade
      architect_context_mode: bselective
      worker_context_mode: bselective
      max_depth: 3
      stages:
        - architect
        - architect_critic
        - architect_revision
        - worker
        - worker_critic
        - architect_replan
    critcascade_audit:
      pattern: critcascade_audit
      architect_context_mode: bselective
      worker_context_mode: bselective
      max_depth: 3
      external_model_required: true
      stages:
        - architect
        - design_audit
        - architect_critic
        - architect_revision
        - worker
        - worker_critic
        - architect_replan
        - code_audit

  contamination_rules:
    duplicate_source_before_edits: true
    original_source_read_only: true
    excluded_worker_paths:
      - "previous-generated-runs/"

  programming_aliases:
    coder: worker
    programmer_critic: worker_critic
    coder_fix: worker_revision

  role_defaults:
    worker: {stage: implementation}
    worker_critic: {stage: implementation_critique, model_policy: prefer_different_model_from_worker, must_not_edit_implementation_files: true}
    worker_revision: {stage: implementation_revision}
    architect:
      # Default architect handoff budget: compact by default so the worker receives a plan, not transcripts.
      handoff_kind: context-budget artifact
      target_words: 350-500
      hard_max_words: 700
      max_relevant_regions: 6
      max_must_implement_bullets: 6
      no_tool_transcripts: true
      no_long_source_quotes: true
      no_full_bselective_output: true
      required_sections:
        - target_file_path
        - relevant_regions
        - must_implement
        - defer
        - do_not_implement
        - risks
        - verification_checks
        - verification_plan
    architect_critic:
      stage: plan_critique
      model_policy: prefer_different_model_from_architect
      required_checks:
        - reviewer_explain_back
        - ready_to_build_bar
        - decisions_md_and_authoritative_decision_records
      must_not_edit_implementation_files: true
    architect_revision: {stage: plan_revision_and_readiness_decision}
    architect_replan: {stage: update_remaining_plan_after_completed_task}

# Generic aliases: coder->worker; programmer_critic->worker_critic; coder_fix->worker_revision
